# Window rules. Syntax targets Hyprland 0.48+ ("windowrule" with class:/title:);
# check against `hyprctl version` on first boot.
# Per-app rules for Houdini, Nuke, Maya etc. are added in step 3, once each
# app's real window classes are known (hyprctl clients).

# Splash screens float.
windowrule = float, title:^(.*[Ss]plash.*)$
# Render progress windows must not steal focus.
windowrule = nofocus, title:^(.*[Rr]ender [Pp]rogress.*)$
# The volume mixer floats.
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
