# vfx-linux Hyprland config. IRIX-inspired: flat, square, no animation,
# terminal-first. Colours come from the active scheme (vfx-theme), app
# rules from rules.conf.
source = ~/.config/vfx-theme/hyprland.conf
source = ~/.config/hypr/rules.conf

monitor = , preferred, auto, 1

$terminal = foot
$launcher = fuzzel --config ~/.config/vfx-theme/fuzzel.ini
$mod = SUPER

env = XCURSOR_SIZE,24
# Qt: prefer Wayland, fall back to X11 for apps with bundled Qt (Maya, Nuke,
# Houdini). Per-app overrides go in the rez wrappers (step 3).
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

exec-once = waybar -s ~/.config/vfx-theme/waybar.css
exec-once = mako -c ~/.config/vfx-theme/mako.conf
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
exec-once = $terminal

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 3
    col.active_border = $active
    col.inactive_border = $inactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $desktop
}

xwayland {
    # Keeps XWayland apps (most VFX apps) sharp on HiDPI.
    force_zero_scaling = true
}

input {
    kb_layout = us
    follow_mouse = 1
}

# --- keys --------------------------------------------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, S, togglesplit
bind = $mod, L, exec, hyprlock -c ~/.config/vfx-theme/hyprlock.conf
bind = $mod SHIFT, T, exec, vfx-theme next

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
